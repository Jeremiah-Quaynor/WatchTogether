<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WatchTogether — microphone access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #15171f;
      color: #eef0f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      max-width: 420px;
      padding: 32px;
      text-align: center;
    }
    .icon { font-size: 40px; margin-bottom: 8px; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { color: #9aa3b5; font-size: 13.5px; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: linear-gradient(135deg, #5b4fe0, #7a6ef0);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 16px; font-size: 13px; color: #9aa3b5; min-height: 18px; }
    #status.error { color: #ff9a85; }
    #status.success { color: #4ad88a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h1>Microphone access for WatchTogether</h1>
    <p>
      Click below and allow microphone access when Chrome asks — this is a
      one-time grant for the WatchTogether extension. It's only used to talk
      to the partner in your current party; nothing is recorded or sent
      anywhere else.
    </p>
    <button id="allow-btn">Allow microphone access</button>
    <div id="status"></div>
  </div>

  <script src="../shared/constants.js"></script>
  <script src="mic-permission.js"></script>
</body>
</html>
